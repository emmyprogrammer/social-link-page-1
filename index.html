<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/query.css">
  <title>Frontend Mentor | Social links profile</title>
</head>
<body>

  <div class="profile">
    <div class="profile-header">
      <div class="profile-img">
      <img src="./assets/images/avatar-jessica.jpeg" alt="jessica image" class="profile-img-1">
      </div>
      <div class="profile-word">
        <div class="name">Jessica Randall</div>
        <div class="location">  London, United Kingdom</div>
        <div class="job">"Front-end developer and avid reader."</div>
      </div>
      <div class="platform">
        <div class="github">GitHub</div>
        <div class="frontend">Frontend Mentor</div>
        <div class="linkedl"> LinkedIn</div>
        <div class="twitter">Twitter</div>
        <div class="instagram">Instagram</div>
      </div>
    </div>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="mailto:emmanuellawal498@gmail.com">LAWAL EMMANUEL</a>.
  </footer>
</body>
</html>
